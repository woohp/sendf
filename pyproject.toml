[project]
name = "sendf"
description = "Easily send files"
version = "0.0.5"
authors = [{ name = "Hui Peng Hu", email = "woohp135@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["starlette>=1.3.1", "uvicorn>=0.51.0"]

[project.optional-dependencies]
dev = ["ipdb", "mypy >= 1.19.1", "ruff >= 0.15.6", "pytest", "httpx2"]

[project.scripts]
sendf = "sendf:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sendf", "upnp"]
packages = ["sendf_data"]

[tool.setuptools.package-data]
sendf_data = ["bip39_english.txt"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s"
testpaths = ["tests.py"]

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
warn_unreachable = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "U", "YTT", "B", "C4", "PT", "Q", "SIM", "FURB"]
ignore = ["E203", "B028", "B905", "C408", "SIM102", "SIM108"]
preview = true
